  <polyline points="40,442 18,442 18,410" fill="none" stroke="#00D9FF" stroke-width="2.5" filter="url(#glow-c)"/>
  <polyline points="1160,442 1182,442 1182,410" fill="none" stroke="#00D9FF" stroke-width="2.5" filter="url(#glow-c)"/>

