<svg width="1200" height="50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-c">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#00FF88;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#00D9FF;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#00FF88;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00FF88;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="50" fill="#0D1117"/>

  <!-- Main line -->
  <line x1="0" y1="25" x2="1200" y2="25" stroke="url(#line-grad)" stroke-width="1.5"/>

  <!-- Circuit branches - upper -->
  <polyline points="200,25 200,14 220,14" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.5"/>
  <polyline points="400,25 400,14 380,14" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.5"/>
  <polyline points="600,25 600,12 630,12" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.5"/>
  <polyline points="800,25 800,14 820,14" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.5"/>
  <polyline points="1000,25 1000,14 980,14" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.5"/>

  <!-- Circuit branches - lower -->
  <polyline points="300,25 300,36 320,36" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.4"/>
  <polyline points="500,25 500,36 480,36" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.4"/>
  <polyline points="700,25 700,36 720,36" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.4"/>
  <polyline points="900,25 900,36 880,36" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.4"/>

  <!-- Nodes on main line -->
  <circle cx="100" cy="25" r="3" fill="#00FF88" filter="url(#glow-g)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="25" r="4" fill="#00FF88" filter="url(#glow-g)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="25" r="3" fill="#00D9FF" filter="url(#glow-c)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="25" r="5" fill="#00D9FF" filter="url(#glow-c)">
    <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="25" r="3" fill="#00FF88" filter="url(#glow-g)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="25" r="4" fill="#00FF88" filter="url(#glow-g)">
    <animate attributeName="opacity" values="1;0.4;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="25" r="3" fill="#00D9FF" filter="url(#glow-c)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.9s" repeatCount="indefinite"/>
  </circle>

  <!-- Traveling pulse -->
  <rect x="-100" y="23" width="100" height="4" rx="2" fill="url(#pulse)" opacity="0.8">
    <animate attributeName="x" values="-100;1200" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
  </rect>

  <!-- Square nodes on branches -->
  <rect x="216" y="10" width="8" height="8" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.6"/>
  <rect x="376" y="10" width="8" height="8" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.6"/>
  <rect x="476" y="32" width="8" height="8" fill="none" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>
  <rect x="816" y="10" width="8" height="8" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.6"/>
</svg>
