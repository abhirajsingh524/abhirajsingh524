<svg width="1200" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#0f1923"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <linearGradient id="gr1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF88"/>
      <stop offset="100%" style="stop-color:#00D9FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="80" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="78" fill="none" stroke="#00FF88" stroke-width="1" opacity="0.3"/>

  <!-- Neural network nodes visualization -->
  <!-- Layer 1 -->
  <circle cx="100" cy="40" r="8" fill="none" stroke="#00FF88" stroke-width="2" filter="url(#glow-g)">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="40" r="3" fill="#00FF88">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Connections layer 1 -> 2 -->
  <line x1="108" y1="36" x2="192" y2="22" stroke="#00FF88" stroke-width="0.8" opacity="0.4"/>
  <line x1="108" y1="40" x2="192" y2="40" stroke="#00FF88" stroke-width="0.8" opacity="0.4"/>
  <line x1="108" y1="44" x2="192" y2="58" stroke="#00FF88" stroke-width="0.8" opacity="0.4"/>

  <!-- Layer 2 -->
  <circle cx="200" cy="22" r="6" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="22" r="2.5" fill="#00D9FF" opacity="0.8"/>
  <circle cx="200" cy="40" r="6" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="40" r="2.5" fill="#00D9FF" opacity="0.8"/>
  <circle cx="200" cy="58" r="6" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.8"/>
  <circle cx="200" cy="58" r="2.5" fill="#00D9FF" opacity="0.8"/>

  <!-- Connections layer 2 -> 3 -->
  <line x1="206" y1="22" x2="294" y2="30" stroke="#00D9FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="206" y1="40" x2="294" y2="30" stroke="#00D9FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="206" y1="40" x2="294" y2="50" stroke="#00D9FF" stroke-width="0.8" opacity="0.3"/>
  <line x1="206" y1="58" x2="294" y2="50" stroke="#00D9FF" stroke-width="0.8" opacity="0.3"/>

  <!-- Layer 3 -->
  <circle cx="300" cy="30" r="7" fill="none" stroke="#7CFC00" stroke-width="2" filter="url(#glow-g)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="30" r="3" fill="#7CFC00"/>
  <circle cx="300" cy="50" r="7" fill="none" stroke="#7CFC00" stroke-width="2" filter="url(#glow-g)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="50" r="3" fill="#7CFC00"/>

  <!-- Center label -->
  <text x="600" y="36" fill="#00FF88" font-size="16" font-family="monospace" font-weight="bold" text-anchor="middle" letter-spacing="6" filter="url(#glow-g)">NEURAL CORE</text>
  <text x="600" y="56" fill="#00D9FF" font-size="11" font-family="monospace" text-anchor="middle" letter-spacing="4" opacity="0.7">DEEP LEARNING ENGINE — ACTIVE</text>

  <!-- Right side mirror nodes -->
  <circle cx="900" cy="30" r="7" fill="none" stroke="#7CFC00" stroke-width="2" filter="url(#glow-g)">
    <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="30" r="3" fill="#7CFC00"/>
  <circle cx="900" cy="50" r="7" fill="none" stroke="#7CFC00" stroke-width="2" filter="url(#glow-g)"/>
  <circle cx="900" cy="50" r="3" fill="#7CFC00"/>

  <line x1="906" y1="30" x2="994" y2="22" stroke="#7CFC00" stroke-width="0.8" opacity="0.3"/>
  <line x1="906" y1="30" x2="994" y2="40" stroke="#7CFC00" stroke-width="0.8" opacity="0.3"/>
  <line x1="906" y1="50" x2="994" y2="40" stroke="#7CFC00" stroke-width="0.8" opacity="0.3"/>
  <line x1="906" y1="50" x2="994" y2="58" stroke="#7CFC00" stroke-width="0.8" opacity="0.3"/>

  <circle cx="1000" cy="22" r="6" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.8"/>
  <circle cx="1000" cy="22" r="2.5" fill="#00D9FF" opacity="0.8"/>
  <circle cx="1000" cy="40" r="6" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.8"/>
  <circle cx="1000" cy="40" r="2.5" fill="#00D9FF" opacity="0.8"/>
  <circle cx="1000" cy="58" r="6" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.8"/>
  <circle cx="1000" cy="58" r="2.5" fill="#00D9FF" opacity="0.8"/>

  <line x1="1008" y1="22" x2="1086" y2="36" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>
  <line x1="1008" y1="40" x2="1086" y2="40" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>
  <line x1="1008" y1="58" x2="1086" y2="44" stroke="#00D9FF" stroke-width="0.8" opacity="0.4"/>

  <circle cx="1100" cy="40" r="8" fill="none" stroke="#00FF88" stroke-width="2" filter="url(#glow-g)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="40" r="3" fill="#00FF88"/>
</svg>
