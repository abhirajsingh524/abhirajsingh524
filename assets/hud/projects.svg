  <line x1="0" y1="276" x2="1200" y2="276" stroke="#00FF88" stroke-width="0.3" opacity="0.1"/>
  <line x1="0" y1="368" x2="1200" y2="368" stroke="#00FF88" stroke-width="0.3" opacity="0.1"/>
  <line x1="400" y1="0" x2="400" y2="460" stroke="#00FF88" stroke-width="0.3" opacity="0.07"/>
  <line x1="800" y1="0" x2="800" y2="460" stroke="#00FF88" stroke-width="0.3" opacity="0.07"/>

  <!-- Border -->
