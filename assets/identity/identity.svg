<svg width="1200" height="60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-c">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1"/>
      <stop offset="20%" style="stop-color:#00FF88;stop-opacity:0.9"/>
      <stop offset="50%" style="stop-color:#00D9FF;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#00FF88;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00FF88;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="60" fill="#0D1117"/>

  <!-- Main horizontal line -->
  <line x1="0" y1="30" x2="1200" y2="30" stroke="url(#line-grad)" stroke-width="1.5"/>

  <!-- Pulsing nodes -->
  <circle cx="180" cy="30" r="5" fill="#00FF88" filter="url(#glow-g)">
    <animate attributeName="r" values="4;8;4" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <circle cx="600" cy="30" r="7" fill="#00D9FF" filter="url(#glow-c)">
    <animate attributeName="r" values="5;10;5" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1020" cy="30" r="5" fill="#00FF88" filter="url(#glow-g)">
    <animate attributeName="r" values="4;8;4" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Traveling pulse -->
  <rect x="-100" y="28" width="100" height="4" rx="2" fill="url(#pulse)" opacity="0.9">
    <animate attributeName="x" values="-100;1200" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1"/>
  </rect>

  <!-- Small diamonds at nodes -->
  <polygon points="600,22 607,30 600,38 593,30" fill="none" stroke="#00D9FF" stroke-width="1.5" filter="url(#glow-c)"/>
</svg>
