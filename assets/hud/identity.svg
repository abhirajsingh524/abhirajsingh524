<svg width="1200" height="420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="glow-g">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-c">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#0b0f14"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF88"/>
      <stop offset="100%" style="stop-color:#00D9FF"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF"/>
      <stop offset="100%" style="stop-color:#7CFC00"/>
    </linearGradient>
    <clipPath id="hexclip">
      <polygon points="180,30 330,30 390,140 330,250 180,250 120,140"/>
    </clipPath>
    <linearGradient id="scan-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00FF88;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Grid -->
  <line x1="0" y1="84" x2="1200" y2="84" stroke="#00FF88" stroke-width="0.3" opacity="0.12"/>
  <line x1="0" y1="168" x2="1200" y2="168" stroke="#00FF88" stroke-width="0.3" opacity="0.12"/>
  <line x1="0" y1="252" x2="1200" y2="252" stroke="#00FF88" stroke-width="0.3" opacity="0.12"/>
  <line x1="0" y1="336" x2="1200" y2="336" stroke="#00FF88" stroke-width="0.3" opacity="0.12"/>
  <line x1="400" y1="0" x2="400" y2="420" stroke="#00FF88" stroke-width="0.3" opacity="0.08"/>
  <line x1="800" y1="0" x2="800" y2="420" stroke="#00FF88" stroke-width="0.3" opacity="0.08"/>

  <!-- Border -->
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="#00FF88" stroke-width="1.5" opacity="0.4"/>

  <!-- TL bracket -->
  <polyline points="40,18 18,18 18,50" fill="none" stroke="#00FF88" stroke-width="2.5" filter="url(#glow-g)"/>
  <!-- TR bracket -->
  <polyline points="1160,18 1182,18 1182,50" fill="none" stroke="#00FF88" stroke-width="2.5" filter="url(#glow-g)"/>
  <!-- BL bracket -->
  <polyline points="40,402 18,402 18,370" fill="none" stroke="#00D9FF" stroke-width="2.5" filter="url(#glow-c)"/>
  <!-- BR bracket -->
  <polyline points="1160,402 1182,402 1182,370" fill="none" stroke="#00D9FF" stroke-width="2.5" filter="url(#glow-c)"/>

  <!-- Header bar -->
  <rect x="0" y="0" width="1200" height="50" fill="#00FF88" opacity="0.04"/>
  <text x="60" y="32" fill="#00FF88" font-size="11" font-family="monospace" letter-spacing="5" filter="url(#glow-g)">[ AI BIOMETRIC IDENTIFICATION SYSTEM ]</text>
  <text x="1140" y="32" fill="#00D9FF" font-size="11" font-family="monospace" letter-spacing="2" text-anchor="end" opacity="0.8">ACCESS: GRANTED</text>

  <!-- Hexagonal frame for avatar -->
  <polygon points="180,62 320,62 370,155 320,248 180,248 130,155"
    fill="none" stroke="#00FF88" stroke-width="2.5" filter="url(#glow-g)"/>
  <!-- Inner hex -->
  <polygon points="185,72 315,72 358,155 315,238 185,238 142,155"
    fill="#0a0e13" stroke="#00D9FF" stroke-width="1" opacity="0.5"/>

  <!-- Avatar placeholder circle inside hex -->
  <circle cx="250" cy="155" r="70" fill="#0f1923" stroke="#00FF88" stroke-width="1.5" opacity="0.8"/>
  <!-- Avatar silhouette -->
  <circle cx="250" cy="135" r="28" fill="#00FF88" opacity="0.25"/>
  <ellipse cx="250" cy="196" rx="42" ry="28" fill="#00FF88" opacity="0.15"/>
  <!-- Scan beam on avatar -->
  <rect x="130" y="60" width="240" height="30" fill="url(#scan-v)" opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,188;0,0" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner decorations on hex -->
  <circle cx="250" cy="62" r="4" fill="#00FF88" filter="url(#glow-g)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="370" cy="155" r="4" fill="#00D9FF" filter="url(#glow-c)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="250" cy="248" r="4" fill="#00FF88" filter="url(#glow-g)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="130" cy="155" r="4" fill="#00D9FF" filter="url(#glow-c)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Verification badges below hex -->
  <text x="250" y="278" fill="#00FF88" font-size="11" font-family="monospace" text-anchor="middle" filter="url(#glow-g)">◉ FACE VERIFIED</text>
  <text x="250" y="296" fill="#00D9FF" font-size="11" font-family="monospace" text-anchor="middle">◉ IDENTITY CONFIRMED</text>
  <text x="250" y="314" fill="#7CFC00" font-size="11" font-family="monospace" text-anchor="middle">◉ AI CORE ACTIVE</text>

  <!-- Status pulse dot -->
  <circle cx="180" cy="340" r="7" fill="#00FF88" filter="url(#glow-g)">
    <animate attributeName="r" values="5;9;5" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="196" y="346" fill="#00FF88" font-size="13" font-family="monospace" font-weight="bold" letter-spacing="2">STATUS: ONLINE</text>

  <!-- Vertical divider -->
  <line x1="440" y1="60" x2="440" y2="380" stroke="#00FF88" stroke-width="1" opacity="0.3"/>

  <!-- Identity data panel -->
  <text x="470" y="100" fill="#00FF88" font-size="13" font-family="monospace" letter-spacing="4" opacity="0.7">IDENTITY RECORD</text>
  <line x1="470" y1="110" x2="800" y2="110" stroke="#00FF88" stroke-width="1" opacity="0.3"/>

  <!-- Identity fields -->
  <g font-family="monospace">
    <text x="470" y="142" fill="#00D9FF" font-size="12" opacity="0.6">NAME</text>
    <text x="600" y="142" fill="#E6EDF3" font-size="16" font-weight="bold" letter-spacing="1">Arpit Singh</text>

    <text x="470" y="176" fill="#00D9FF" font-size="12" opacity="0.6">DESIGNATION</text>
    <text x="600" y="176" fill="#00FF88" font-size="14" filter="url(#glow-g)">Artificial Intelligence Engineer</text>

    <text x="470" y="210" fill="#00D9FF" font-size="12" opacity="0.6">EDUCATION</text>
    <text x="600" y="210" fill="#E6EDF3" font-size="13">B.Tech — Artificial Intelligence</text>

    <text x="470" y="244" fill="#00D9FF" font-size="12" opacity="0.6">INSTITUTION</text>
    <text x="600" y="244" fill="#E6EDF3" font-size="13">Invertis University</text>

    <text x="470" y="278" fill="#00D9FF" font-size="12" opacity="0.6">LOCATION</text>
    <text x="600" y="278" fill="#E6EDF3" font-size="13">India  🌐</text>

    <text x="470" y="312" fill="#00D9FF" font-size="12" opacity="0.6">MISSION</text>
    <text x="600" y="312" fill="#7CFC00" font-size="13">Building Intelligent AI Systems</text>

    <text x="470" y="346" fill="#00D9FF" font-size="12" opacity="0.6">CLEARANCE</text>
    <text x="600" y="346" fill="#FFD700" font-size="13">AVAILABLE FOR AI COLLABORATION</text>
  </g>

  <!-- Right panel: skill bars -->
  <line x1="860" y1="60" x2="860" y2="380" stroke="#00FF88" stroke-width="1" opacity="0.3"/>

  <text x="890" y="100" fill="#00FF88" font-size="13" font-family="monospace" letter-spacing="4" opacity="0.7">CORE COMPETENCIES</text>
  <line x1="890" y1="110" x2="1160" y2="110" stroke="#00FF88" stroke-width="1" opacity="0.3"/>

  <!-- Skill bars -->
  <g font-family="monospace" font-size="12">
    <!-- Python -->
    <text x="890" y="142" fill="#00D9FF" opacity="0.8">PYTHON</text>
    <text x="1150" y="142" fill="#00FF88" text-anchor="end">98%</text>
    <rect x="890" y="148" width="260" height="8" rx="1" fill="#0f1318"/>
    <rect x="890" y="148" width="0" height="8" rx="1" fill="url(#bar1)">
      <animate attributeName="width" values="0;255" dur="2s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>

    <!-- Machine Learning -->
    <text x="890" y="178" fill="#00D9FF" opacity="0.8">MACHINE LEARNING</text>
    <text x="1150" y="178" fill="#00FF88" text-anchor="end">95%</text>
    <rect x="890" y="184" width="260" height="8" rx="1" fill="#0f1318"/>
    <rect x="890" y="184" width="0" height="8" rx="1" fill="url(#bar1)">
      <animate attributeName="width" values="0;247" dur="2s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>

    <!-- Deep Learning -->
    <text x="890" y="214" fill="#00D9FF" opacity="0.8">DEEP LEARNING</text>
    <text x="1150" y="214" fill="#00FF88" text-anchor="end">92%</text>
    <rect x="890" y="220" width="260" height="8" rx="1" fill="#0f1318"/>
    <rect x="890" y="220" width="0" height="8" rx="1" fill="url(#bar2)">
      <animate attributeName="width" values="0;239" dur="2s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>

    <!-- Generative AI -->
    <text x="890" y="250" fill="#00D9FF" opacity="0.8">GENERATIVE AI</text>
    <text x="1150" y="250" fill="#00FF88" text-anchor="end">93%</text>
    <rect x="890" y="256" width="260" height="8" rx="1" fill="#0f1318"/>
    <rect x="890" y="256" width="0" height="8" rx="1" fill="url(#bar1)">
      <animate attributeName="width" values="0;242" dur="2s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>

    <!-- Computer Vision -->
    <text x="890" y="286" fill="#00D9FF" opacity="0.8">COMPUTER VISION</text>
    <text x="1150" y="286" fill="#00FF88" text-anchor="end">88%</text>
    <rect x="890" y="292" width="260" height="8" rx="1" fill="#0f1318"/>
    <rect x="890" y="292" width="0" height="8" rx="1" fill="url(#bar2)">
      <animate attributeName="width" values="0;229" dur="2s" begin="1.0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>

    <!-- Data Analytics -->
    <text x="890" y="322" fill="#00D9FF" opacity="0.8">DATA ANALYTICS</text>
    <text x="1150" y="322" fill="#00FF88" text-anchor="end">91%</text>
    <rect x="890" y="328" width="260" height="8" rx="1" fill="#0f1318"/>
    <rect x="890" y="328" width="0" height="8" rx="1" fill="url(#bar1)">
      <animate attributeName="width" values="0;237" dur="2s" begin="1.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>

    <!-- NLP -->
    <text x="890" y="358" fill="#00D9FF" opacity="0.8">NLP / LLM</text>
    <text x="1150" y="358" fill="#00FF88" text-anchor="end">90%</text>
    <rect x="890" y="364" width="260" height="8" rx="1" fill="#0f1318"/>
    <rect x="890" y="364" width="0" height="8" rx="1" fill="url(#bar2)">
      <animate attributeName="width" values="0;234" dur="2s" begin="1.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
    </rect>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="390" width="1200" height="30" fill="#00FF88" opacity="0.04"/>
  <text x="60" y="410" fill="#00FF88" font-size="10" font-family="monospace" letter-spacing="3" opacity="0.5">BIOMETRIC SCAN COMPLETE</text>
  <text x="600" y="410" fill="#00D9FF" font-size="10" font-family="monospace" letter-spacing="3" text-anchor="middle" opacity="0.5">NEURAL ID: ARPIT-AI-524</text>
  <text x="1140" y="410" fill="#00FF88" font-size="10" font-family="monospace" letter-spacing="3" text-anchor="end" opacity="0.5">CLEARANCE LEVEL: ALPHA</text>
</svg>
